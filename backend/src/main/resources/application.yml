server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:file:./data/leavedb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true

camunda:
  client:
    mode: self-managed
    grpc-address: http://localhost:26500
    rest-address: http://localhost:8080
    # If authentication is enabled on your Camunda cluster, configure the
    # client credentials supported by your installed version here.
